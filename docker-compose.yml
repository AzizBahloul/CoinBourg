# ===========================================
# CoinBourg Docker Compose Configuration
# ===========================================
# Production-ready setup with PostgreSQL, Redis, and the trading bot
# Optimized for Azure Student B1s VM (1 vCPU, 1GB RAM)

version: '3.8'

services:
  # ===========================================
  # CoinBourg Trading Bot API
  # ===========================================
  coinbourg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinbourg-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://coinbourg:coinbourg_secure_password@db:5432/coinbourg
      - REDIS_URL=redis://redis:6379/0
      - AUTO_START_BOT=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coinbourg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Memory limits for Azure B1s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: coinbourg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinbourg
      POSTGRES_PASSWORD: coinbourg_secure_password
      POSTGRES_DB: coinbourg
      # Performance tuning for limited resources
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - coinbourg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinbourg -d coinbourg"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Memory limits for Azure B1s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # PostgreSQL config for low memory
    command: >
      postgres 
      -c shared_buffers=64MB 
      -c effective_cache_size=128MB 
      -c maintenance_work_mem=32MB 
      -c work_mem=4MB
      -c max_connections=20

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: coinbourg-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - coinbourg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # ===========================================
  # Nginx Reverse Proxy (Optional)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: coinbourg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - coinbourg
    networks:
      - coinbourg-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 32M

# ===========================================
# Networks
# ===========================================
networks:
  coinbourg-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
