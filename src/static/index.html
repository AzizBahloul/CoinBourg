<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinBourg - Advanced AI Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0e27; }
        .gradient-bg { background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d1b4e 100%); position: relative; overflow: hidden; }
        .gradient-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%); animation: rotate 30s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-strong { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px); }
        .glow-green { box-shadow: 0 0 30px rgba(34, 197, 94, 0.3); }
        .glow-red { box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }
        .glow-blue { box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); } 50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.8); } }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .slide-up { animation: slideUp 0.5s ease-out; }
        .gradient-text { background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.7); }
        @keyframes tickerScroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-scroll { animation: tickerScroll 30s linear infinite; }
        @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } }
        .live-pulse { animation: livePulse 1.5s ease-in-out infinite; }
        .chart-container { position: relative; height: 300px; }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white" x-data="advancedDashboard()" x-init="init()">
    
    <!-- Live Price Ticker -->
    <div class="glass border-b border-white/10 overflow-hidden">
        <div class="ticker-scroll whitespace-nowrap py-2">
            <template x-for="ticker in priceTickers" :key="ticker.symbol">
                <span class="inline-flex items-center mx-8">
                    <span class="font-semibold" x-text="ticker.symbol"></span>
                    <span class="mx-2 text-gray-400">$</span>
                    <span x-text="ticker.price?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})"></span>
                    <span class="ml-2 text-sm" :class="ticker.change >= 0 ? 'text-green-400' : 'text-red-400'">
                        <span x-text="(ticker.change >= 0 ? '+' : '') + ticker.change?.toFixed(2) + '%'"></span>
                    </span>
                </span>
            </template>
        </div>
    </div>

    <!-- Header -->
    <header class="glass-strong sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-[1800px] mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-xl flex items-center justify-center animate-pulse-glow">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold gradient-text">CoinBourg</h1>
                            <p class="text-xs text-gray-400">AI-Powered Trading System</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full glass">
                        <div class="w-2.5 h-2.5 rounded-full live-pulse" :class="status.is_running ? 'bg-green-400' : 'bg-red-400'"></div>
                        <span class="text-sm font-medium" x-text="status.is_running ? 'LIVE' : 'OFFLINE'"></span>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <button @click="toggleAutoRefresh()" 
                        class="px-4 py-2 rounded-lg glass transition-all hover:bg-white/10"
                        :class="autoRefresh ? 'text-green-400' : 'text-gray-400'">
                        <div class="flex items-center space-x-2">
                            <svg class="w-4 h-4" :class="autoRefresh ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            <span class="text-sm font-medium">Auto</span>
                        </div>
                    </button>
                    
                    <button @click="toggleBot()" 
                        class="px-6 py-2.5 rounded-xl font-semibold transition-all transform hover:scale-105"
                        :class="status.is_running ? 'bg-red-500/20 text-red-400 hover:bg-red-500/30 glow-red' : 'bg-green-500/20 text-green-400 hover:bg-green-500/30 glow-green'">
                        <span x-text="status.is_running ? '⏸ Stop Bot' : '▶ Start Bot'"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1800px] mx-auto px-6 py-8 space-y-8">
        
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-6">
            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">Portfolio</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-3xl font-bold mb-1" x-text="'$' + (status.portfolio_value?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00')"></div>
                <div class="text-sm flex items-center" :class="status.total_pnl >= 0 ? 'text-green-400' : 'text-red-400'">
                    <span x-text="(status.total_pnl >= 0 ? '↑' : '↓')"></span>
                    <span class="ml-1" x-text="'$' + Math.abs(status.total_pnl || 0).toFixed(2)"></span>
                </div>
            </div>

            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">Win Rate</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-3xl font-bold mb-1" x-text="(status.win_rate?.toFixed(1) || '0.0') + '%'"></div>
                <div class="text-sm text-gray-400">
                    <span class="text-green-400" x-text="status.winning_trades || 0"></span> / 
                    <span class="text-red-400" x-text="status.losing_trades || 0"></span>
                </div>
            </div>

            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">Total Trades</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                        </svg>
                    </div>
                </div>
                <div class="text-3xl font-bold mb-1" x-text="status.total_trades || 0"></div>
                <div class="text-sm text-gray-400">
                    Today: <span class="text-white font-semibold" x-text="status.daily_trades || 0"></span>/<span x-text="status.max_daily_trades || 10"></span>
                </div>
            </div>

            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">Risk Level</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-orange-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-2xl font-bold mb-1" x-text="status.risk_level || 'CONSERVATIVE'"></div>
                <div class="text-xs text-gray-400">Max Position: <span class="text-white" x-text="(status.max_position_size || 5) + '%'"></span></div>
            </div>

            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">Positions</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-3xl font-bold mb-1" x-text="positions.length"></div>
                <div class="text-sm text-gray-400">
                    <span class="text-blue-400" x-text="positions.filter(p => (p.pnl_percent || 0) > 0).length"></span> profitable
                </div>
            </div>

            <div class="glass rounded-2xl p-6 slide-up hover:bg-white/5 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-gray-400 text-sm font-medium">System</span>
                    <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-rose-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-2xl font-bold mb-1 text-green-400">HEALTHY</div>
                <div class="text-xs text-gray-400">
                    API: <span class="text-green-400">● Online</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
            
            <div class="xl:col-span-2 space-y-8">
                
                <!-- AI Analysis -->
                <div class="glass rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 bg-blue-400 rounded-full animate-pulse"></div>
                            <h2 class="text-xl font-bold">🧠 Live AI Analysis</h2>
                        </div>
                        <span class="text-xs text-gray-400" x-text="'Updated ' + lastUpdate"></span>
                    </div>
                    
                    <div class="space-y-4 max-h-[600px] overflow-y-auto scrollbar-thin pr-2">
                        <template x-for="thought in aiThoughts" :key="thought.timestamp">
                            <div class="glass-strong rounded-xl p-5 slide-up hover:bg-white/10 transition-all">
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-12 h-12 rounded-lg flex items-center justify-center font-bold text-lg"
                                            :class="{
                                                'bg-green-500/20 text-green-400': thought.action === 'BUY',
                                                'bg-red-500/20 text-red-400': thought.action === 'SELL',
                                                'bg-yellow-500/20 text-yellow-400': thought.action === 'HOLD'
                                            }">
                                            <span x-text="thought.symbol?.replace('USDT', '')"></span>
                                        </div>
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-lg" x-text="thought.symbol"></span>
                                                <span class="text-xs px-2 py-1 rounded-full" 
                                                    :class="{
                                                        'bg-green-500/20 text-green-400': thought.action === 'BUY',
                                                        'bg-red-500/20 text-red-400': thought.action === 'SELL',
                                                        'bg-yellow-500/20 text-yellow-400': thought.action === 'HOLD'
                                                    }">
                                                    <span x-text="thought.action"></span>
                                                </span>
                                            </div>
                                            <div class="text-xs text-gray-400 mt-1">
                                                <span x-text="formatTime(thought.timestamp)"></span> • 
                                                $<span x-text="thought.price?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-2xl font-bold" 
                                            :class="thought.confidence >= 0.75 ? 'text-green-400' : thought.confidence >= 0.65 ? 'text-yellow-400' : 'text-gray-400'">
                                            <span x-text="(thought.confidence * 100).toFixed(0) + '%'"></span>
                                        </div>
                                        <div class="text-xs text-gray-400">Confidence</div>
                                    </div>
                                </div>
                                
                                <div class="space-y-2">
                                    <div class="flex items-center space-x-2 text-sm">
                                        <span class="text-gray-400">Sentiment:</span>
                                        <span class="font-semibold" x-text="thought.sentiment"></span>
                                    </div>
                                    <p class="text-sm text-gray-300 leading-relaxed" x-text="thought.reasoning"></p>
                                    
                                    <template x-if="thought.filtered_reason">
                                        <div class="mt-3 p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                                            <div class="flex items-center space-x-2 text-yellow-400 text-xs">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                                </svg>
                                                <span class="font-semibold">Filtered:</span>
                                                <span x-text="thought.filtered_reason"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        
                        <template x-if="aiThoughts.length === 0">
                            <div class="text-center py-12 text-gray-400">
                                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                                </svg>
                                <p>Waiting for AI analysis...</p>
                                <p class="text-sm mt-2">Start the bot to see live trading signals</p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Chart -->
                <div class="glass rounded-2xl p-6">
                    <h2 class="text-xl font-bold mb-6">📈 Portfolio Performance</h2>
                    <div class="chart-container">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

            </div>

            <!-- Right Column -->
            <div class="space-y-8">
                
                <!-- Positions -->
                <div class="glass rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">💼 Open Positions</h2>
                        <span class="px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 text-sm font-semibold" x-text="positions.length"></span>
                    </div>
                    
                    <div class="space-y-4 max-h-[400px] overflow-y-auto scrollbar-thin">
                        <template x-for="position in positions" :key="position.id">
                            <div class="glass-strong rounded-xl p-4 hover:bg-white/10 transition-all">
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-lg flex items-center justify-center font-bold"
                                            :class="position.side === 'BUY' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'">
                                            <span x-text="position.symbol?.replace('USDT', '')"></span>
                                        </div>
                                        <div>
                                            <div class="font-semibold" x-text="position.symbol"></div>
                                            <div class="text-xs text-gray-400" x-text="position.side"></div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-lg font-bold" :class="(position.pnl_percent || 0) >= 0 ? 'text-green-400' : 'text-red-400'">
                                            <span x-text="((position.pnl_percent || 0) >= 0 ? '+' : '') + (position.pnl_percent || 0).toFixed(2) + '%'"></span>
                                        </div>
                                        <div class="text-xs text-gray-400">
                                            $<span x-text="(position.pnl || 0).toFixed(2)"></span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-3 text-xs">
                                    <div>
                                        <div class="text-gray-400">Entry</div>
                                        <div class="font-semibold">$<span x-text="position.entry_price?.toFixed(2)"></span></div>
                                    </div>
                                    <div>
                                        <div class="text-gray-400">Current</div>
                                        <div class="font-semibold">$<span x-text="position.current_price?.toFixed(2)"></span></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        
                        <template x-if="positions.length === 0">
                            <div class="text-center py-12 text-gray-400">
                                <p>No open positions</p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Quick Analysis -->
                <div class="glass rounded-2xl p-6">
                    <h2 class="text-xl font-bold mb-6">⚡ Quick Analysis</h2>
                    
                    <form @submit.prevent="runQuickAnalysis()" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Select Symbol</label>
                            <select x-model="quickAnalysisSymbol" 
                                class="w-full px-4 py-3 rounded-lg glass border border-white/10 focus:border-indigo-500 focus:outline-none text-white">
                                <option value="BTCUSDT">Bitcoin (BTC)</option>
                                <option value="ETHUSDT">Ethereum (ETH)</option>
                                <option value="BNBUSDT">Binance Coin (BNB)</option>
                                <option value="SOLUSDT">Solana (SOL)</option>
                                <option value="XRPUSDT">Ripple (XRP)</option>
                            </select>
                        </div>
                        
                        <button type="submit" 
                            class="w-full py-3 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-600 font-semibold hover:from-indigo-600 hover:to-purple-700 transition-all transform hover:scale-105 glow-blue"
                            :disabled="quickAnalysisLoading">
                            <span x-show="!quickAnalysisLoading">🔍 Run AI Analysis</span>
                            <span x-show="quickAnalysisLoading">Analyzing...</span>
                        </button>
                    </form>
                    
                    <template x-if="quickAnalysisResult">
                        <div class="mt-6 glass-strong rounded-xl p-4 slide-up">
                            <div class="flex items-center justify-between mb-4">
                                <span class="font-semibold text-lg" x-text="quickAnalysisResult.symbol"></span>
                                <span class="px-3 py-1 rounded-full text-sm font-semibold"
                                    :class="{
                                        'bg-green-500/20 text-green-400': quickAnalysisResult.action === 'BUY',
                                        'bg-red-500/20 text-red-400': quickAnalysisResult.action === 'SELL',
                                        'bg-yellow-500/20 text-yellow-400': quickAnalysisResult.action === 'HOLD'
                                    }">
                                    <span x-text="quickAnalysisResult.action"></span>
                                </span>
                            </div>
                            <div class="text-2xl font-bold mb-2" x-text="(quickAnalysisResult.confidence * 100).toFixed(0) + '% Confidence'"></div>
                            <p class="text-sm text-gray-300" x-text="quickAnalysisResult.reasoning"></p>
                        </div>
                    </template>
                </div>

            </div>
        </div>

    </main>

    <script>
        function advancedDashboard() {
            return {
                status: {}, positions: [], aiThoughts: [], recentTrades: [], priceTickers: [],
                autoRefresh: true, lastUpdate: 'just now', quickAnalysisSymbol: 'BTCUSDT',
                quickAnalysisResult: null, quickAnalysisLoading: false, performanceChart: null,

                async init() {
                    await this.fetchAll();
                    this.initPerformanceChart();
                    this.startAutoRefresh();
                    this.startPriceTicker();
                },

                async fetchAll() {
                    try {
                        await Promise.all([this.fetchStatus(), this.fetchPositions(), this.fetchAIThoughts()]);
                        this.lastUpdate = 'just now';
                    } catch (e) { console.error(e); }
                },

                async fetchStatus() {
                    const r = await fetch('/api/status');
                    this.status = await r.json();
                },

                async fetchPositions() {
                    const r = await fetch('/api/positions');
                    this.positions = await r.json();
                },

                async fetchAIThoughts() {
                    const r = await fetch('/api/ai-thoughts?limit=20');
                    const d = await r.json();
                    this.aiThoughts = d.thoughts || [];
                    this.updatePriceTickers();
                },

                async toggleBot() {
                    const action = this.status.is_running ? 'stop' : 'start';
                    await fetch(\`/api/bot/\${action}\`, { method: 'POST' });
                    await this.fetchStatus();
                },

                async runQuickAnalysis() {
                    this.quickAnalysisLoading = true;
                    try {
                        const r = await fetch('/api/analyze', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ symbol: this.quickAnalysisSymbol })
                        });
                        this.quickAnalysisResult = await r.json();
                    } finally {
                        this.quickAnalysisLoading = false;
                    }
                },

                startAutoRefresh() {
                    setInterval(() => { if (this.autoRefresh) this.fetchAll(); }, 5000);
                },

                toggleAutoRefresh() { this.autoRefresh = !this.autoRefresh; },

                startPriceTicker() {
                    setInterval(() => this.updatePriceTickers(), 3000);
                },

                updatePriceTickers() {
                    const symbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT'];
                    this.priceTickers = symbols.map(s => {
                        const t = this.aiThoughts.find(a => a.symbol === s);
                        return { symbol: s, price: t?.price || 0, change: Math.random() * 10 - 5 };
                    });
                },

                initPerformanceChart() {
                    const ctx = document.getElementById('performanceChart');
                    if (!ctx) return;
                    this.performanceChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: Array.from({length: 24}, (_, i) => \`\${i}:00\`),
                            datasets: [{
                                label: 'Portfolio',
                                data: Array.from({length: 24}, () => Math.random() * 1000 + 9000),
                                borderColor: 'rgb(99, 102, 241)',
                                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                                tension: 0.4,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                                x: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                            }
                        }
                    });
                },

                formatTime(ts) {
                    if (!ts) return '';
                    const d = new Date(ts);
                    const diff = Math.floor((new Date() - d) / 1000);
                    if (diff < 60) return \`\${diff}s ago\`;
                    if (diff < 3600) return \`\${Math.floor(diff / 60)}m ago\`;
                    if (diff < 86400) return \`\${Math.floor(diff / 3600)}h ago\`;
                    return d.toLocaleDateString();
                }
            }
        }
    </script>
</body>
</html>
