<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinBourg - Testing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .test-selector {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .test-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .test-card.selected {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .test-card h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .test-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .run-test-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }

        .result-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .result-card h4 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-weight: 500;
        }

        .metric-value {
            font-weight: 700;
        }

        .metric-value.positive {
            color: #10b981;
        }

        .metric-value.negative {
            color: #ef4444;
        }

        .best-symbols {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .symbol-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .symbol-table th,
        .symbol-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .symbol-table th {
            background: #f8f9fa;
            font-weight: 700;
            color: #667eea;
        }

        .symbol-table tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-running {
            background: #fef3c7;
            color: #92400e;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🧪 CoinBourg Testing Dashboard</h1>
            <p class="subtitle">Comprehensive Testing & Validation System</p>
            <div style="display:flex; gap:10px; flex-wrap: wrap; align-items: center; margin-top:15px;">
                <div id="suiteChips" style="display:flex; gap:8px; flex-wrap: wrap;"></div>
                <div style="margin-left:auto; text-align:right;">
                    <div style="font-size:0.9em; color:#666;">Last Run</div>
                    <div id="lastRun" style="font-weight:700;">-</div>
                </div>
                <button id="rerunFailed" class="btn" style="padding:10px 16px; font-size:0.95em;">↻ Re-run Failed Only</button>
            </div>
        </div>

        <!-- Test Selector -->
        <div class="test-selector">
            <h2>Select Test Type</h2>
            <div class="test-grid" id="testGrid"></div>
        </div>

        <!-- Run Test Section -->
        <div class="run-test-section">
            <h2>Run Test</h2>
            <div class="form-group">
                <label>Trading Pairs (comma-separated)</label>
                <input type="text" id="symbols" placeholder="BTCUSDT, ETHUSDT, BNBUSDT" value="BTCUSDT,ETHUSDT">
            </div>
            <div class="form-group">
                <label>Start Date</label>
                <input type="datetime-local" id="startDate">
            </div>
            <div class="form-group">
                <label>End Date</label>
                <input type="datetime-local" id="endDate">
            </div>
            <div class="form-group">
                <label>Initial Capital (USDT)</label>
                <input type="number" id="capital" value="10000" min="100">
            </div>
            <div class="form-group">
                <label>Risk Level</label>
                <select id="riskLevel">
                    <option value="CONSERVATIVE">Conservative</option>
                    <option value="MODERATE" selected>Moderate</option>
                    <option value="AGGRESSIVE">Aggressive</option>
                </select>
            </div>
            <button class="btn" onclick="runTest()" id="runTestBtn">🚀 Run Test</button>
        </div>

        <!-- Test Results -->
        <div class="results-section">
            <h2>Recent Test Results</h2>
            <div class="results-grid" id="resultsGrid">
                <div class="loading">Loading results...</div>
            </div>
        </div>

        <!-- Best Performing Symbols -->
        <div class="best-symbols">
            <h2>🏆 Best Performing Cryptocurrencies</h2>
            <table class="symbol-table" id="bestSymbolsTable">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Accuracy</th>
                        <th>Total Predictions</th>
                        <th>Successful</th>
                        <th>Avg Profit/Trade</th>
                    </tr>
                </thead>
                <tbody id="bestSymbolsBody">
                    <tr><td colspan="5" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let selectedTestType = 'backtesting';

        async function init() {
            await loadTestTypes();
            await loadResults();
            await loadBestSymbols();
            setDefaultDates();
            document.getElementById('rerunFailed').addEventListener('click', rerunFailed);
        }

        function setDefaultDates() {
            const now = new Date();
            const oneMonthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('startDate').value = oneMonthAgo.toISOString().slice(0, 16);
            document.getElementById('endDate').value = now.toISOString().slice(0, 16);
        }

        async function loadTestTypes() {
            try {
                const response = await fetch(`${API_BASE}/api/tests/types`);
                const data = await response.json();
                const grid = document.getElementById('testGrid');
                grid.innerHTML = data.test_types.map(test => `
                    <div class="test-card ${test.name === 'backtesting' ? 'selected' : ''}" onclick="selectTest('${test.name}')">
                        <h3>${formatTestName(test.name)}</h3>
                        <p>${test.description}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading test types:', error);
            }
        }

        function selectTest(testType) {
            selectedTestType = testType;
            document.querySelectorAll('.test-card').forEach(card => card.classList.remove('selected'));
            event.target.closest('.test-card').classList.add('selected');
        }

        async function runTest() {
            const btn = document.getElementById('runTestBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Running Test...';
            const symbols = document.getElementById('symbols').value.split(',').map(s => s.trim());
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const capital = parseFloat(document.getElementById('capital').value);
            const riskLevel = document.getElementById('riskLevel').value;

            try {
                const response = await fetch(`${API_BASE}/api/tests/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        test_type: selectedTestType,
                        symbols,
                        start_date: new Date(startDate).toISOString(),
                        end_date: new Date(endDate).toISOString(),
                        initial_capital: capital,
                        risk_level: riskLevel,
                        parameters: {}
                    })
                });
                const result = await response.json();
                alert(`Test started successfully! ${result.message}`);
                setTimeout(() => loadResults(), 3000);
            } catch (error) {
                alert(`Error running test: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Run Test';
            }
        }

        async function loadResults() {
            try {
                const response = await fetch(`${API_BASE}/api/tests/results?limit=6`);
                const data = await response.json();
                const first = data.results && data.results.length > 0 ? data.results[0] : null;
                const ts = first?.completed_at || first?.updated_at || first?.created_at;
                document.getElementById('lastRun').textContent = ts ? new Date(ts).toLocaleString() : '-';
                const grid = document.getElementById('resultsGrid');

                if (data.results && data.results.length > 0) {
                    grid.innerHTML = data.results.map(result => `
                        <div class="result-card" onclick="viewTestDetails('${result.id}')">
                            <h4>${formatTestName(result.test_type)}</h4>
                            <span class="status-badge status-${result.status}">${result.status}</span>
                            <div class="metric"><span class="metric-label">Symbols:</span><span class="metric-value">${result.symbols ? result.symbols.join(', ') : 'N/A'}</span></div>
                            <div class="metric"><span class="metric-label">Return:</span><span class="metric-value ${result.total_return_pct > 0 ? 'positive' : 'negative'}">${result.total_return_pct ? result.total_return_pct.toFixed(2) : '0'}%</span></div>
                            <div class="metric"><span class="metric-label">Accuracy:</span><span class="metric-value">${result.accuracy ? result.accuracy.toFixed(2) : '0'}%</span></div>
                            <div class="metric"><span class="metric-label">Win Rate:</span><span class="metric-value">${result.win_rate ? result.win_rate.toFixed(2) : '0'}%</span></div>
                            <div class="metric"><span class="metric-label">Predictions:</span><span class="metric-value">${result.total_predictions || 0}</span></div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="loading">No test results yet. Run a test to get started!</div>';
                }
                renderSuiteChips(data.results || []);
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('resultsGrid').innerHTML = '<div class="loading">Error loading results</div>';
            }
        }

        async function loadBestSymbols() {
            try {
                const response = await fetch(`${API_BASE}/api/tests/best-symbols?limit=10`);
                const data = await response.json();
                const tbody = document.getElementById('bestSymbolsBody');
                if (data.best_performing_symbols && data.best_performing_symbols.length > 0) {
                    tbody.innerHTML = data.best_performing_symbols.map(symbol => `
                        <tr>
                            <td><strong>${symbol.symbol}</strong></td>
                            <td><span class="metric-value positive">${symbol.accuracy ? symbol.accuracy.toFixed(2) : '0'}%</span></td>
                            <td>${symbol.total_predictions || 0}</td>
                            <td>${symbol.successful_predictions || 0}</td>
                            <td class="${symbol.avg_profit_per_trade > 0 ? 'metric-value positive' : 'metric-value negative'}">$${symbol.avg_profit_per_trade ? symbol.avg_profit_per_trade.toFixed(2) : '0.00'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="loading">No symbol data yet</td></tr>';
                }
            } catch (error) {
                console.error('Error loading best symbols:', error);
            }
        }

        function viewTestDetails(testId) {
            alert(`Viewing details for test: ${testId}\n\nFeature coming soon!`);
        }

        function renderSuiteChips(results) {
            const summary = {};
            results.forEach(r => {
                const key = (r.test_type || 'unknown').toUpperCase();
                if (!summary[key]) summary[key] = { pass: 0, fail: 0 };
                if (r.status && r.status.toLowerCase() === 'failed') summary[key].fail += 1; else summary[key].pass += 1;
            });
            const container = document.getElementById('suiteChips');
            container.innerHTML = Object.entries(summary).map(([name, s]) => {
                const bg = s.fail > 0 ? '#fee2e2' : '#d1fae5';
                const color = s.fail > 0 ? '#991b1b' : '#065f46';
                return `<span style="padding:8px 12px; border-radius:20px; background:${bg}; color:${color}; font-weight:700;">${name}: ${s.pass}/${s.pass + s.fail}</span>`;
            }).join('');
        }

        async function rerunFailed() {
            alert('Re-running failed suites...');
        }

        function formatTestName(name) {
            return name.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        setInterval(() => {
            loadResults();
            loadBestSymbols();
        }, 10000);

        init();
    </script>
</body>
</html>
