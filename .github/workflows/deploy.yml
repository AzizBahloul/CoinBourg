name: Deploy to Azure VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='venv' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Azure VM
        run: |
          # Upload archive
          sshpass -p "${{ secrets.AZURE_PASSWORD }}" scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}:~/
          
          # Run deployment commands
          sshpass -p "${{ secrets.AZURE_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }} << 'DEPLOY'
            set -e
            
            echo "=== Deployment started ==="
            cd ~
            
            # Extract archive
            echo "Extracting archive..."
            mkdir -p CoinBourg
            tar -xzf deploy.tar.gz -C CoinBourg/
            rm deploy.tar.gz
            
            cd CoinBourg
            
            # Create .env file from secrets
            echo "Creating .env file..."
            echo "APP_NAME=CoinBourg AI Trading Bot" > .env
            echo "APP_VERSION=1.0.0" >> .env
            echo "DEBUG=false" >> .env
            echo "ENVIRONMENT=production" >> .env
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
            echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> .env
            echo "DEEPSEEK_MODEL=deepseek-chat" >> .env
            echo "BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}" >> .env
            echo "BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}" >> .env
            echo "BINANCE_TESTNET=false" >> .env
            echo "DATABASE_URL=postgresql://coinbourg:coinbourg_secure_password@db:5432/coinbourg" >> .env
            echo "REDIS_URL=redis://redis:6379/0" >> .env
            echo "RISK_LEVEL=MODERATE" >> .env
            echo "MAX_POSITION_SIZE_PERCENT=5.0" >> .env
            echo "MAX_DAILY_TRADES=20" >> .env
            echo "STOP_LOSS_PERCENT=2.5" >> .env
            echo "TAKE_PROFIT_PERCENT=5.0" >> .env
            echo "MAX_DRAWDOWN_PERCENT=10.0" >> .env
            echo "PAPER_TRADING=true" >> .env
            echo "PAPER_TRADING_INITIAL_CAPITAL=100.0" >> .env
            echo "MAX_COINS_SCAN=100" >> .env
            echo "MIN_VOLUME_USD=500000" >> .env
            echo 'TRADING_PAIRS=["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"]' >> .env
            echo "BASE_CURRENCY=USDT" >> .env
            echo "ANALYSIS_INTERVAL_SECONDS=300" >> .env
            echo "PRICE_CHECK_INTERVAL_SECONDS=10" >> .env
            echo "API_HOST=0.0.0.0" >> .env
            echo "API_PORT=8000" >> .env
            echo "SECRET_KEY=${{ secrets.APP_SECRET_KEY }}" >> .env
            echo "LOG_LEVEL=INFO" >> .env
            
            # Validate .env file syntax before deployment
            echo "Validating .env file syntax..."
            if grep -E '\\$|`|\$\{' .env | grep -v '^#'; then
              echo "WARNING: .env contains potential shell expansion characters"
            fi
            
            # Pre-deployment checks
            echo "Running pre-deployment validation checks..."
            if [ -f docker-compose.yml ]; then
              docker compose config > /dev/null && echo "✓ Docker Compose configuration valid"
            fi
            
            # Forcefully clean up existing containers and networks
            echo "Stopping and removing existing containers..."
            docker compose down --remove-orphans || true
            docker-compose down --remove-orphans || true
            
            # Force remove any remaining containers with these names
            echo "Force removing any lingering containers..."
            docker rm -f coinbourg-bot coinbourg-db coinbourg-redis coinbourg-nginx 2>/dev/null || true
            
            # Remove containers by partial name match (handles different prefixes)
            echo "Removing any containers with 'coinbourg' in name..."
            docker ps -a --format '{{.Names}}' | grep -i coinbourg | xargs -r docker rm -f 2>/dev/null || true
            
            # Remove the network if it exists (try both possible names)
            echo "Removing existing networks..."
            docker network rm coinbourg_coinbourg-network 2>/dev/null || true
            docker network rm coinbourg_default 2>/dev/null || true
            docker network ls | grep coinbourg | awk '{print $1}' | xargs -r docker network rm 2>/dev/null || true
            
            # Clean up Docker to free space
            echo "Cleaning up Docker resources..."
            docker system prune -af --volumes || true
            
            echo "Building images (no cache)..."
            docker compose build --no-cache
            echo "Starting containers..."
            docker compose up -d
            
            # Wait for containers to start
            echo "Waiting for containers to initialize (30s)..."
            sleep 30
            
            # Show container status
            echo "=== Container Status ==="
            docker compose ps
            
            # Check individual services
            echo ""
            echo "=== Checking Services ==="
            
            # Check PostgreSQL
            if docker compose exec -T db pg_isready -U coinbourg > /dev/null 2>&1; then
              echo "✓ PostgreSQL is ready"
            else
              echo "✗ PostgreSQL is not ready"
            fi
            
            # Check Redis
            if docker compose exec -T redis redis-cli ping > /dev/null 2>&1; then
              echo "✓ Redis is ready"
            else
              echo "✗ Redis is not ready"
            fi
            
            # Check application
            echo ""
            echo "=== Checking Application Health ==="
            for i in {1..10}; do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✓ CoinBourg API is healthy and responding on port 8000"
                curl -s http://localhost:8000/health | head -3
                break
              fi
              if [ $i -eq 10 ]; then
                echo "✗ App failed to respond after 10 attempts"
                echo "=== Application Logs ==="
                docker compose logs --tail=30 coinbourg
              else
                echo "Attempt $i/10: Waiting for app..."
                sleep 3
              fi
            done
            
            # Check port accessibility
            echo ""
            echo "=== Port Status ==="
            netstat -tuln | grep -E ':(8000|5432|6379)' || echo "Checking ports..."
            
            # Show recent logs
            echo ""
            echo "=== Recent Application Logs ==="
            docker compose logs --tail=20 coinbourg
            
            echo ""
            echo "=== Deployment Complete ==="
            echo "Access the application at: http://4.235.122.138:8000"
          DEPLOY
          
          echo "✓ Deployment successful!"
