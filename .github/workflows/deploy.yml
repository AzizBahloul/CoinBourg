name: Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='venv' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Azure VM
        run: |
          # Upload archive
          sshpass -p "${{ secrets.AZURE_PASSWORD }}" scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}:~/
          
          # Run deployment commands
          sshpass -p "${{ secrets.AZURE_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }} << 'DEPLOY'
            set -e
            
            echo "=== Deployment started ==="
            cd ~
            
            # Extract archive
            echo "Extracting archive..."
            mkdir -p CoinBourg
            tar -xzf deploy.tar.gz -C CoinBourg/
            rm deploy.tar.gz
            
            cd CoinBourg
            
            # Create .env file
            echo "Creating .env file..."
            cat > .env << 'EOF'
            APP_NAME=CoinBourg AI Trading Bot
            APP_VERSION=1.0.0
            DEBUG=false
            ENVIRONMENT=production
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=https://api.deepseek.com
            DEEPSEEK_MODEL=deepseek-chat
            BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
            BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}
            BINANCE_TESTNET=false
            DATABASE_URL=postgresql://coinbourg:coinbourg_secure_password@db:5432/coinbourg
            REDIS_URL=redis://redis:6379/0
            RISK_LEVEL=CONSERVATIVE
            MAX_POSITION_SIZE_PERCENT=5.0
            MAX_DAILY_TRADES=10
            STOP_LOSS_PERCENT=2.0
            TAKE_PROFIT_PERCENT=4.0
            MAX_DRAWDOWN_PERCENT=10.0
            TRADING_PAIRS=["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"]
            BASE_CURRENCY=USDT
            ANALYSIS_INTERVAL_SECONDS=300
            PRICE_CHECK_INTERVAL_SECONDS=10
            API_HOST=0.0.0.0
            API_PORT=8000
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            LOG_LEVEL=INFO
            EOF
            
            # Restart application
            echo "Restarting Docker containers..."
            docker compose down || true
            docker compose up -d --build
            
            # Wait for containers to start
            sleep 10
            
            # Show status
            echo "=== Deployment complete ==="
            docker compose ps
          DEPLOY
          
          echo "✓ Deployment successful!"
