name: Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='venv' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd ~
            
            # Upload archive using heredoc
            cat > deploy.tar.gz << 'ARCHIVE'
            $(cat deploy.tar.gz | base64)
            ARCHIVE
            
            # Create CoinBourg directory
            mkdir -p CoinBourg
            cd CoinBourg
            
            # Extract archive
            tar -xzf ~/deploy.tar.gz
            rm ~/deploy.tar.gz
            
            # Create .env file with secrets
            cat > .env << 'EOF'
            APP_NAME=CoinBourg AI Trading Bot
            APP_VERSION=1.0.0
            DEBUG=false
            ENVIRONMENT=production
            DEEPSEEK_API_KEY=${{ env.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=https://api.deepseek.com
            DEEPSEEK_MODEL=deepseek-chat
            BINANCE_API_KEY=${{ env.BINANCE_API_KEY }}
            BINANCE_API_SECRET=${{ env.BINANCE_API_SECRET }}
            BINANCE_TESTNET=false
            DATABASE_URL=postgresql://coinbourg:coinbourg_secure_password@db:5432/coinbourg
            REDIS_URL=redis://redis:6379/0
            RISK_LEVEL=CONSERVATIVE
            MAX_POSITION_SIZE_PERCENT=5.0
            MAX_DAILY_TRADES=10
            STOP_LOSS_PERCENT=2.0
            TAKE_PROFIT_PERCENT=4.0
            MAX_DRAWDOWN_PERCENT=10.0
            TRADING_PAIRS=["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"]
            BASE_CURRENCY=USDT
            ANALYSIS_INTERVAL_SECONDS=300
            PRICE_CHECK_INTERVAL_SECONDS=10
            API_HOST=0.0.0.0
            API_PORT=8000
            SECRET_KEY=${{ env.APP_SECRET_KEY }}
            LOG_LEVEL=INFO
            EOF
            
            # Restart the application
            echo "Restarting application..."
            docker compose down || true
            docker compose up -d --build
            
            # Show status
            echo "Deployment complete!"
            docker compose ps
